    mock_analysis: '{"summary":"Cliente solicitou visita para amanhã às 14h para imóvel no Centro.","last_sender":"customer","intent":"schedule_visit","facts":{"Viewing Interest":true},"signals":{"has_new_question":false,"has_pending_visit":true,"customer_engaged":true},"context":{"last_action":{"type":"visit","actor":"customer","description":"Solicitou visita amanhã às 14h"},"visit":{"proposed_date":"amanhã","proposed_time":"14h"}}}'
    mock_reply: '{"answerable":true,"sources":["catalogo.md"],"reply":"Perfeito! Vou encaminhar seu pedido de visita para amanhã às 14h."}'
