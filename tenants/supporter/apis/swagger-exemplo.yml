# Exemplo de especificação flexível em .yml (Swagger / OpenAPI ou definição livre)
# Todos os campos são opcionais — preencha apenas o que fizer sentido para o serviço.

openapi: 3.0.3
info:
  title: API Sistema Exemplo
  version: 1.0.0
  description: Especificação de endpoints do serviço externo.

servers:
  - url: https://api.exemplo.com.br

# Bloco opcional de autenticação / credenciais de acesso
x-auth:
  authenticated: true
  type: bearer # bearer, basic, api_key, session, none
  login: seu_usuario_aqui
  password: sua_senha_aqui
  login_endpoint: POST /auth/login

paths:
  /auth/login:
    post:
      summary: Autenticar com login e senha
      description: Recebe login e senha e retorna o token de acesso.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Token gerado com sucesso

  /v1/contracts/{contractNumber}:
    get:
      summary: Consultar contrato por número
      description: Retorna status atual (Ativo, Cancelado, Atrasado), matrícula e dados do contrato.
      parameters:
        - name: contractNumber
          in: path
          description: Número do contrato
          schema:
            type: string
      responses:
        "200":
          description: Dados do contrato

  /v1/requests:
    get:
      summary: Listar solicitações
      description: Lista solicitações filtrando por status ou consultor.
      parameters:
        - name: status
          in: query
          description: Status da solicitação (ex. PENDING, APPROVED, REJECTED)
          schema:
            type: string
      responses:
        "200":
          description: Lista de solicitações
