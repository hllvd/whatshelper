    # --------------------------------------------------------------------------
    # Classifications
    # --------------------------------------------------------------------------
    ClassificationLevelResponse:
      type: object
      properties:
        id:
          type: integer
          description: ID do nível de classificação.
        name:
          type: string
          description: Nome do nível (ex. Bronze, Prata, Ouro).
        description:
          type: string
          nullable: true
        prize:
          type: string
          nullable: true
          description: Descrição da premiação/comissão correspondente.
        salesGoal:
          type: number
          format: decimal
          nullable: true
          description: Meta de vendas associada ao nível.
        retention:
          type: integer
          nullable: true
          description: Meta de retenção percentual.
        nextLevelId:
          type: integer
          nullable: true
        nextLevelName:
          type: string
          nullable: true
        activeUsersCount:
          type: integer
          description: Quantidade total de consultores ativos classificados neste nível.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClassificationLevelsListApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ClassificationLevelResponse'

    UserClassificationResponse:
      type: object
      properties:
        id:
          type: integer
          description: ID do registro de enquadramento.
        userId:
          type: string
          format: uuid
          description: UUID do consultor.
        userName:
          type: string
          description: Nome do consultor.
        userEmail:
          type: string
          description: E-mail do consultor.
        levelId:
          type: integer
          description: ID do nível em que está classificado.
        levelName:
          type: string
          description: Nome do nível do plano de carreira (ex. Bronze, Prata, Sênior).
        levelDescription:
          type: string
          nullable: true
        levelPrize:
          type: string
          nullable: true
        levelSalesGoal:
          type: number
          format: decimal
          nullable: true
          description: Meta de vendas correspondente ao nível ativo.
        startDate:
          type: string
          format: date-time
          description: Data em que o consultor ingressou neste nível.
        endDate:
          type: string
          format: date-time
          nullable: true
          description: Data de término do enquadramento (nulo se ainda vigente).
        isActive:
          type: boolean
          description: true se o enquadramento estiver em vigor.

    UserClassificationApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserClassificationResponse'
              nullable: true
              description: Detalhes do nível do usuário no plano de carreira, ou null caso não esteja enquadrado.

    UserClassificationListApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/UserClassificationResponse'
