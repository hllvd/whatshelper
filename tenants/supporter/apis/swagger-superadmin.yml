openapi: 3.0.3
info:
  title: SalesApp API - Superadmin Read-Only (GET) Inspection Spec
  description: >
    Especificação OpenAPI 3.0 estritamente de LEITURA (métodos HTTP GET) da API do SalesApp.
    Projetada para agentes de inteligência artificial e chats LLM que atuam como Superadmin
    para inspecionar e auditar o estado do sistema com segurança total (sem risco de mutação ou escrita).
    Permite verificar contratos (incluindo se foram deletados), usuários, titularidade de matrículas,
    equipes, planos de carreira, saúde e histórico de sincronizações.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Servidor de Desenvolvimento Local
  - url: https://api.salesapp.com
    description: Servidor de Produção

security:
  - BearerAuth: []

tags:
  - name: Contracts
    description: Consulta, auditoria e detalhamento de contratos e vendas
  - name: AdminTools
    description: Ferramentas administrativas de leitura exclusiva de Superadmin (excluídos, inconsistências e busca rápida)
  - name: Users
    description: Gestão, busca e estatísticas de consultores, gestores e hierarquia
  - name: Matriculas
    description: Gestão de matrículas e mapeamento de vínculos N:N com titularidade (isOwner)
  - name: Teams
    description: Estrutura organizacional de equipes, líderes e membros
  - name: CareerPlan
    description: Avaliação de metas, comissões, níveis e retenção (RT1 a RT6) de consultores
  - name: Imports
    description: Histórico de ingestão e processamento de planilhas e cargas de dados
  - name: Scraping
    description: Rastreabilidade das execuções do robô de extração do Power BI
  - name: Monitoring
    description: Diagnóstico de saúde, integridade e volume por matrícula e equipe
  - name: Dashboard
    description: Métricas consolidadas de vendas, faturamento e atingimento por segmento
  - name: ApprovalRequests
    description: Solicitações e pendências de aprovação de consultores (tela #/requests)
  - name: Classifications
    description: Classificações de níveis e verificação de enquadramento no plano de carreira (tela #/classifications)

paths:
  # ============================================================================
  # 1. CONTRACTS & SALES (LEITURA)
  # ============================================================================
  /api/contracts/number/{contractNumber}:
    get:
      tags:
        - Contracts
      summary: Consultar contrato pelo número
      description: >
        Localiza um contrato ativo pelo seu número comercial. Retorna o titular associado (userName, userId),
        status, valor total, matrícula vinculada, cliente e a data da última atualização (updatedAt).
      parameters:
        - name: contractNumber
          in: path
          required: true
          description: Número oficial do contrato (ex. CTR-987654).
          schema:
            type: string
      responses:
        '200':
          description: Contrato localizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractApiResponse'
        '404':
          description: Contrato não encontrado ou pendente de reivindicação por outro consultor.

  /api/contracts/{id}:
    get:
      tags:
        - Contracts
      summary: Consultar contrato por ID interno
      description: Busca os detalhes completos de um contrato pela sua chave primária numérica.
      parameters:
        - name: id
          in: path
          required: true
          description: ID interno numérico do contrato.
          schema:
            type: integer
      responses:
        '200':
          description: Contrato retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractApiResponse'
        '404':
          description: Contrato não encontrado.

  /api/contracts:
    get:
      tags:
        - Contracts
      summary: Listar contratos com filtros avançados
      description: >
        Lista contratos de forma paginada permitindo filtrar por texto de busca,
        consultor titular, intervalo de datas e status.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Número da página.
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
          description: Quantidade de registros por página.
        - name: search
          in: query
          schema:
            type: string
          description: Termo de busca por contrato ou cliente.
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
          description: Filtra contratos pertencentes a um consultor específico.
        - name: status
          in: query
          schema:
            type: string
          description: Filtra por status (ex. Ativo, Cancelado).
      responses:
        '200':
          description: Lista paginada de contratos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedContractApiResponse'

  /api/contracts/user/{userId}:
    get:
      tags:
        - Contracts
      summary: Listar todos os contratos de um consultor específico
      description: >
        Retorna a carteira de contratos atribuídos ao consultor identificado pelo UUID,
        com suporte a paginação e filtro por matrícula ou data.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do consultor titular.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: matricula
          in: query
          schema:
            type: string
          description: Opcional - Filtrar por código de matrícula específico.
      responses:
        '200':
          description: Carteira de contratos do consultor retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedContractApiResponse'

  /api/contracts/aggregation/historic-production:
    get:
      tags:
        - Contracts
      summary: Consultar produção histórica agrupada
      description: >
        Retorna a soma consolidada de valores vendidos e quantidade de contratos
        agrupados mês a mês para o período especificado.
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Data inicial do período.
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: Data final do período.
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
          description: Opcional - Filtrar histórico de um consultor específico.
      responses:
        '200':
          description: Agregação histórica calculada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricProductionApiResponse'

  # ============================================================================
  # 2. ADMIN TOOLS (AUDITORIA E EXCLUSÕES)
  # ============================================================================
  /api/admintools/deleted-contracts:
    get:
      tags:
        - AdminTools
      summary: Verificar se contratos foram excluídos (Soft-Deleted)
      description: >
        Consulta contratos que foram excluídos/cancelados logicamente no sistema.
        Permite verificar se um contrato específico foi deletado passando 'contractNumber'
        ou listar contratos excluídos por equipe.
      parameters:
        - name: contractNumber
          in: query
          schema:
            type: string
          description: Número específico do contrato para verificar se foi deletado.
        - name: exactMatch
          in: query
          schema:
            type: boolean
            default: true
          description: Se true, busca correspondência exata do número do contrato.
        - name: teamId
          in: query
          schema:
            type: integer
          description: Opcional - Filtrar contratos excluídos de uma equipe específica.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Lista de contratos excluídos encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedContractApiResponse'

  /api/admintools/users/search:
    get:
      tags:
        - AdminTools
      summary: Busca rápida de usuários para administração
      description: >
        Busca compacta e otimizada de usuários por nome ou e-mail, trazendo
        diretamente a lista de matrículas atribuídas a cada um.
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Nome ou e-mail a pesquisar.
      responses:
        '200':
          description: Lista de usuários com matrículas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSearchApiResponse'

  /api/admintools/team-inconsistencies:
    get:
      tags:
        - AdminTools
      summary: Diagnóstico de inconsistências entre consultores e equipes
      description: >
        Identifica membros que possuem contratos atribuídos a equipes divergentes
        da sua equipe atual ou vínculos cadastrais conflituosos.
      responses:
        '200':
          description: Lista de inconsistências identificadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTeamInconsistenciesApiResponse'

  # ============================================================================
  # 3. USERS (USUÁRIOS E GESTORES)
  # ============================================================================
  /api/users:
    get:
      tags:
        - Users
      summary: Listar e pesquisar usuários
      description: >
        Lista usuários cadastrados permitindo busca por nome, e-mail ou
        localização direta do consultor titular de um determinado número de contrato.
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Termo de busca (nome ou e-mail).
        - name: contractNumber
          in: query
          schema:
            type: string
          description: Número de contrato para localizar o consultor titular.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            default: active
          description: Filtra por status ('active', 'inactive', 'all').
      responses:
        '200':
          description: Lista paginada de usuários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserApiResponse'

  /api/users/check-email:
    get:
      tags:
        - Users
      summary: Verificar se um e-mail de usuário existe no sistema
      description: >
        Verificação instantânea que retorna se determinado endereço de e-mail já está cadastrado.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          description: E-mail a ser verificado.
      responses:
        '200':
          description: Resultado da verificação do e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCheckApiResponse'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Detalhes do perfil do usuário por UUID
      description: >
        Retorna informações completas do usuário incluindo papel, equipe atual,
        gestor hierárquico direto e data de último acesso.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do usuário.
      responses:
        '200':
          description: Dados do usuário retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '404':
          description: Usuário não encontrado.

  /api/users/{id}/stats:
    get:
      tags:
        - Users
      summary: Estatísticas de produção e retenção do usuário
      description: >
        Retorna total de produção acumulada, percentual de retenção geral,
        retenção estrita e quantidade de contratos pendentes de resolução.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do consultor.
      responses:
        '200':
          description: Estatísticas do usuário retornadas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsApiResponse'

  # ============================================================================
  # 4. MATRICULAS (VÍNCULOS E TITULARIDADE)
  # ============================================================================
  /api/usermatriculas:
    get:
      tags:
        - Matriculas
      summary: Listar todos os vínculos de matrículas e titulares
      description: >
        Retorna a tabela de relacionamentos N:N entre usuários e matrículas.
        O campo 'isOwner' identifica se o consultor é o titular/proprietário da matrícula
        ou se é um participante associado.
      responses:
        '200':
          description: Vínculos de matrículas recuperados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMatriculasListApiResponse'

  /api/usermatriculas/user/{userId}:
    get:
      tags:
        - Matriculas
      summary: Listar matrículas vinculadas a um usuário específico
      description: >
        Consulta todas as matrículas atribuídas ao consultor especificado pelo UUID,
        detalhando quais ele é proprietário (isOwner = true).
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do consultor.
      responses:
        '200':
          description: Matrículas do usuário recuperadas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMatriculasListApiResponse'

  /api/matriculas:
    get:
      tags:
        - Matriculas
      summary: Listar catálogo mestre de matrículas
      description: Retorna a lista de todas as matrículas comerciais cadastradas na aplicação.
      responses:
        '200':
          description: Catálogo de matrículas recuperado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatriculasMasterListApiResponse'

  # ============================================================================
  # 5. TEAMS (EQUIPES COMERCIAIS)
  # ============================================================================
  /api/teams:
    get:
      tags:
        - Teams
      summary: Listar todas as equipes comerciais, líderes e membros
      description: >
        Retorna a relação de equipes de vendas cadastradas, indicando o consultor
        líder/proprietário (Owner) e a lista completa de membros ativos.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: active
          description: Filtrar equipes ('active', 'inactive', 'all').
      responses:
        '200':
          description: Lista de equipes retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsListApiResponse'

  # ============================================================================
  # 6. CAREER PLAN (PLANO DE CARREIRA & RTs)
  # ============================================================================
  /api/careerplan/consultants:
    get:
      tags:
        - CareerPlan
      summary: Listar consultores com status consolidado no Plano de Carreira
      description: >
        Retorna a lista de todos os consultores contendo nível atual, nível alvo,
        metas de vendas, atingimento percentual da produção e taxa de retenção estrita.
      responses:
        '200':
          description: Lista consolidada de consultores retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerPlanConsultantsApiResponse'

  /api/careerplan/users/{userId}:
    get:
      tags:
        - CareerPlan
      summary: Avaliação detalhada do Plano de Carreira de um consultor
      description: >
        Informa o nível atual, próximo nível desejado, todos os requisitos e métricas
        brutas de elegibilidade (produção 12m/15m, retenção 6m/12m/15m estrita e membros de equipe).
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do consultor avaliado.
      responses:
        '200':
          description: Avaliação do plano de carreira gerada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerPlanEvaluationApiResponse'

  /api/careerplan/users/{userId}/contracts-rt:
    get:
      tags:
        - CareerPlan
      summary: Acompanhamento de parcelas pagas e retenção (RT1 a RT6) de contratos
      description: >
        Retorna tabela paginada de contratos do consultor com o status de cada parcela
        de retenção (RT1, RT2, RT3, RT4, RT5, RT6), meses de atraso e se a 1ª parcela foi paga.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do consultor.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Tabela de acompanhamento de RTs recuperada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractRtPageApiResponse'

  /api/careerplan/config:
    get:
      tags:
        - CareerPlan
      summary: Configurações e regras vigentes do Plano de Carreira
      description: >
        Retorna as regras gerais do plano de carreira, dia de fechamento mensal e
        os níveis atualmente configurados no sistema.
      responses:
        '200':
          description: Configurações do plano de carreira recuperadas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerPlanConfigApiResponse'

  # ============================================================================
  # 7. IMPORTS & SCRAPING (HISTÓRICO DE CARGAS)
  # ============================================================================
  /api/imports/history:
    get:
      tags:
        - Imports
      summary: Histórico de importações de planilhas e cargas
      description: >
        Lista as sessões de importação de arquivos no sistema, informando data de conclusão,
        arquivo carregado, total de linhas processadas e quantidade de falhas.
      responses:
        '200':
          description: Histórico de importações retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportHistoryApiResponse'

  /api/scrape/runs/all:
    get:
      tags:
        - Scraping
      summary: Histórico das execuções do robô de scraping do Power BI
      description: >
        Retorna as rodadas de sincronização automática com o Power BI,
        apresentando status final (SUCCESS/FAILED), horário e total de registros extraídos.
      responses:
        '200':
          description: Histórico de execuções de scraping retornado com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScrapeRunSummary'

  # ============================================================================
  # 8. MONITORING & DASHBOARDS
  # ============================================================================
  /api/monitoring/contracts:
    get:
      tags:
        - Monitoring
      summary: Diagnóstico de saúde e volume por matrícula
      description: >
        Retorna relatório de saúde operacional indicando a última sincronização de cada
        matrícula comercial e a contagem de contratos ativos associados.
      responses:
        '200':
          description: Relatório de saúde das matrículas gerado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatriculaHealthApiResponse'

  /api/monitoring/equipes:
    get:
      tags:
        - Monitoring
      summary: Diagnóstico de saúde de matrículas agrupadas por equipe
      description: >
        Consolida a situação das matrículas de cada equipe comercial,
        apontando o pior status de integridade encontrado na equipe.
      responses:
        '200':
          description: Saúde das equipes retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMatriculaHealthApiResponse'

  /api/monitoring/admins:
    get:
      tags:
        - Monitoring
      summary: Estatísticas de importação por administrador
      description: >
        Informa o total de cargas de dados e a data da última importação
        realizada por cada gestor/administrador.
      responses:
        '200':
          description: Estatísticas de administradores geradas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImportStatsApiResponse'

  /api/dashboard/segments:
    get:
      tags:
        - Dashboard
      summary: Indicadores consolidados de vendas por segmento e metas
      description: >
        Gera métricas executivas de faturamento e volume segmentado por segmento
        (Motores, Lar, Outros) e percentual de atingimento de metas.
      parameters:
        - name: adminUserId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do gestor/administrador cujo dashboard será gerado.
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
          description: Se true, força o recalculo ignorando o cache.
      responses:
        '200':
          description: Métricas do dashboard geradas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSegmentsApiResponse'

  # ============================================================================
  # 9. APPROVAL REQUESTS (SOLICITAÇÕES - TELA #/requests)
  # ============================================================================
  /api/approval-requests/pending:
    get:
      tags:
        - ApprovalRequests
      summary: Listar solicitações de aprovação pendentes
      description: >
        Retorna todas as solicitações pendentes de análise (reivindicações de contratos,
        solicitações de matrícula, etc.) acessíveis ao usuário/superadmin atual.
      responses:
        '200':
          description: Solicitações pendentes retornadas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestsListApiResponse'

  /api/approval-requests/mine:
    get:
      tags:
        - ApprovalRequests
      summary: Listar solicitações criadas pelo usuário autenticado
      description: Retorna o histórico de solicitações abertas pelo usuário logado e seus status.
      responses:
        '200':
          description: Solicitações do usuário retornadas com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestsListApiResponse'

  # ============================================================================
  # 10. CLASSIFICATIONS (PLANO DE CARREIRA - TELA #/classifications)
  # ============================================================================
  /api/classifications/users/{userId}/active:
    get:
      tags:
        - Classifications
      summary: Verificar se um usuário está ou não em um Plano de Carreira
      description: >
        Retorna a classificação e nível ativo do consultor no plano de carreira.
        Se o usuário estiver enquadrado, 'data' conterá os detalhes do nível (levelId, levelName, salesGoal, etc.).
        Se NÃO estiver no plano de carreira, 'data' retornará 'null'.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do consultor a ser verificado.
      responses:
        '200':
          description: Consulta realizada com sucesso (data é null se não estiver enquadrado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserClassificationApiResponse'

  /api/classifications/users/{userId}/history:
    get:
      tags:
        - Classifications
      summary: Histórico de níveis e classificações do usuário
      description: >
        Retorna todos os enquadramentos, promoções e períodos em que o consultor
        esteve classificado nos diferentes níveis do plano de carreira.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do consultor.
      responses:
        '200':
          description: Histórico de classificações retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserClassificationListApiResponse'

  /api/classifications/levels:
    get:
      tags:
        - Classifications
      summary: Listar níveis de classificação e contagem de usuários ativos
      description: >
        Retorna todos os níveis cadastrados no plano de carreira (ex. Bronze, Prata, Ouro, Sênior),
        suas metas de venda, retenção e a quantidade atual de consultores ativos em cada nível.
      responses:
        '200':
          description: Lista de níveis de classificação retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationLevelsListApiResponse'

  /api/classifications/levels/{levelId}/members:
    get:
      tags:
        - Classifications
      summary: Listar consultores atualmente classificados em um nível
      description: Retorna a relação de usuários ativos que pertencem a determinado nível do plano de carreira.
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: integer
          description: ID do nível de classificação.
      responses:
        '200':
          description: Membros do nível retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserClassificationListApiResponse'

# ==============================================================================
# COMPONENTS & SCHEMAS
# ==============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT de Superadmin passado no header Authorization (Bearer <token>)

  schemas:
    # --------------------------------------------------------------------------
    # Generic API Wrapper
    # --------------------------------------------------------------------------
    ApiResponseBase:
      type: object
      properties:
        success:
          type: boolean
          description: Indica se a requisição foi atendida com sucesso.
        message:
          type: string
          description: Mensagem descritiva do resultado da operação.

    # --------------------------------------------------------------------------
    # Contracts
    # --------------------------------------------------------------------------
    ContractResponse:
      type: object
      properties:
        id:
          type: integer
          description: Identificador único primário do contrato.
        contractNumber:
          type: string
          description: Código comercial identificador do contrato.
        userId:
          type: string
          format: uuid
          nullable: true
          description: UUID do consultor titular proprietário do contrato.
        userName:
          type: string
          nullable: true
          description: Nome completo do consultor titular.
        totalAmount:
          type: number
          format: decimal
          description: Valor financeiro total transacionado na venda.
        groupId:
          type: integer
          nullable: true
          description: ID do grupo/consórcio.
        groupName:
          type: string
          description: Descrição do grupo ou consórcio.
        status:
          type: string
          description: Status padronizado do contrato (ex. Ativo, Cancelado).
        rawStatus:
          type: string
          nullable: true
          description: Status bruto original vindo da integração externa.
        contractStartDate:
          type: string
          format: date-time
          description: Data de vigência ou início do contrato.
        isActive:
          type: boolean
          description: Indica se o contrato está ativo (false indica soft-deleted).
        createdAt:
          type: string
          format: date-time
          description: Data em que o contrato foi registrado no sistema.
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última alteração deste contrato.
        segment:
          type: integer
          nullable: true
          description: Código do segmento de mercado.
        segmentName:
          type: string
          nullable: true
          description: Descrição do segmento (ex. Imóveis, Veículos).
        quota:
          type: integer
          nullable: true
          description: Número da cota associada.
        customerName:
          type: string
          nullable: true
          description: Nome do cliente comprador.
        matriculaId:
          type: integer
          nullable: true
          description: ID interno da matrícula associada.
        matriculaNumber:
          type: string
          nullable: true
          description: Número da matrícula sob a qual a venda ocorreu.
        hasPayment:
          type: boolean
          nullable: true
          description: Se houve comprovação de pagamento de parcela.
        isAwaitingPayment:
          type: boolean
          description: Se o contrato aguarda confirmação de liquidação.
        teamName:
          type: string
          nullable: true
          description: Nome da equipe comercial do consultor.

    ContractApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ContractResponse'

    PagedContractApiResponse:
      allOf:
