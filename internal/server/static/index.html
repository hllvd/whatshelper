<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Whatshelper — Simulador</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Whatshelper Brain — Simulador</h1>
    <nav aria-label="Navegação principal">
      <ul class="nav-links">
        <li><a href="/" aria-current="page">Chat Simulador</a></li>
        <li><a href="/thinking">Pensando (Traces)</a></li>
        <li><a href="/knowledge">Conhecimento</a></li>
        <li><a href="/journey">Jornada & Funil</a></li>
        <li><a href="/contacts">Clientes</a></li>
      </ul>
    </nav>
  </header>

  <div class="layout-grid">
    <aside class="panel" aria-label="Sessões do simulador">
      <h2>Sessão</h2>
      <div class="session-controls">
        <label for="tenant-input">Tenant</label>
        <input id="tenant-input" type="text" value="demo" autocomplete="off">
        <label for="session-input">Source Key</label>
        <input id="session-input" type="text" value="sim-user-1" autocomplete="off">
        <button id="new-session-btn" type="button">Nova Sessão</button>
      </div>
      <h2>Conversas Recentes</h2>
      <ul id="sources-list" class="source-list"></ul>
      <h2>Pendências e Aprovações</h2>
      <div id="pending-tasks" style="display:flex;flex-direction:column;gap:0.5rem;"></div>
      <h2>Auditoria origin=unknown</h2>
      <ul id="unknown-origin-list" class="source-list"></ul>
    </aside>

    <main class="panel chat-container">
      <div class="toolbar-row" style="justify-content:space-between;">
        <h2 id="active-session-title">Conversa</h2>
        <div class="toolbar-row">
          <span id="source-status-badge" class="status-pill">active</span>
          <button id="btn-pause" type="button" class="btn-sm">Pausar Bot</button>
          <button id="btn-handoff" type="button" class="btn-sm">Assumir Humano</button>
          <button id="btn-resume" type="button" class="btn-sm">Reativar</button>
          <button id="btn-sim-human-phone" type="button" class="btn-sm">Responder como dono (celular)</button>
          <button id="btn-sim-bot-echo" type="button" class="btn-sm">Simular eco do bot</button>
          <button id="btn-test-llm" type="button" class="btn-sm">Testar LLM</button>
          <span id="llm-test-status" class="status-pill" style="display:none;" aria-live="polite"></span>
          <span id="sse-status" class="status-pill" aria-live="polite">Conectando SSE...</span>
        </div>
      </div>

      <section id="chat-messages" class="chat-messages" aria-label="Mensagens da conversa" aria-live="polite"></section>

      <form id="chat-form" class="chat-form">
        <label for="chat-input" class="visually-hidden">Mensagem do cliente</label>
        <textarea id="chat-input" placeholder="Digite sua mensagem como cliente (Enter para enviar, Shift+Enter para quebrar linha)..." required></textarea>
        <button id="send-button" type="submit" class="primary">Enviar</button>
      </form>
    </main>
  </div>

  <script src="/static/sim.js"></script>
</body>
</html>
