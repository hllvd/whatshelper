<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Whatshelper — Clientes & Contatos</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .contacts-container {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 1rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 900px) {
      .contacts-container {
        grid-template-columns: 1fr;
      }
    }
    .search-bar-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .search-input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
    }
    .contact-card {
      padding: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .contact-card:hover, .contact-card.selected {
      border-color: var(--accent);
      background: var(--surface-alt);
    }
    .contact-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.35rem;
    }
    .contact-name {
      font-weight: 600;
      font-size: 1rem;
    }
    .contact-meta {
      font-size: 0.825rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .detail-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .detail-section {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .detail-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .detail-title {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }
    .btn-danger {
      background-color: var(--rem-fg);
      color: #fff;
      border: 1px solid transparent;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn-danger:hover {
      opacity: 0.9;
    }
    .source-pill-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.6rem;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.85rem;
      text-decoration: none;
      color: var(--text);
    }
    .source-pill-link:hover {
      border-color: var(--accent);
    }
    .summary-box {
      background: var(--surface-alt);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
      white-space: pre-wrap;
      border-left: 3px solid var(--accent);
    }
    .facts-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.5rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .fact-item {
      background: var(--surface-alt);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-size: 0.825rem;
      border: 1px solid var(--border);
    }
    .global-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Whatshelper Brain — Clientes</h1>
    <nav aria-label="Navegação principal">
      <ul class="nav-links">
        <li><a href="/">Chat Simulador</a></li>
        <li><a href="/thinking">Pensando (Traces)</a></li>
        <li><a href="/knowledge">Conhecimento</a></li>
        <li><a href="/journey">Jornada & Funil</a></li>
        <li><a href="/contacts" aria-current="page">Clientes</a></li>
      </ul>
    </nav>
  </header>

  <div class="contacts-container">
    <!-- Coluna Esquerda: Busca e Lista de Clientes -->
    <section>
      <div class="global-bar">
        <div>
          <label for="tenant-select" style="font-weight:600; font-size:0.85rem;">Tenant:</label>
          <input id="tenant-select" type="text" value="demo" style="width:90px; padding:0.25rem 0.5rem;" autocomplete="off">
        </div>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <span style="font-size:0.85rem; font-weight:600;">Listening Global:</span>
          <button id="btn-toggle-global-listening" type="button" class="btn-sm">Carregando...</button>
        </div>
      </div>

      <div class="search-bar-row">
        <input id="contact-search" class="search-input" type="search" placeholder="Buscar cliente por nome, e-mail, telefone ou ID..." autocomplete="off">
        <button id="btn-refresh" type="button" class="btn-sm">Atualizar</button>
      </div>

      <div id="contacts-list" aria-live="polite">
        <div style="padding:1rem; color:var(--muted); text-align:center;">Carregando clientes...</div>
      </div>
    </section>

    <!-- Coluna Direita: Detalhes e Resumo do Cliente Selecionado -->
    <aside class="detail-panel" id="contact-detail" aria-label="Detalhes do cliente">
      <div style="color:var(--muted); text-align:center; padding:3rem 1rem;">
        Selecione um cliente ao lado para ver seus dados, histórico do LLM e gerenciar atendimento.
      </div>
    </aside>
  </div>

  <script src="/static/contacts.js"></script>
</body>
</html>
