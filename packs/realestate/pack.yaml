name: realestate
language: pt-BR

actors:
  business: broker
  customer: customer

facts:
  - key: Intent
    type: string
    description: Intenção principal do cliente (ex. compra, locação, investimento)
  - key: Property Type
    type: string
    description: Tipo de imóvel procurado (ex. apartamento, casa, terreno, sala comercial)
  - key: Location
    type: string
    description: Região, bairro ou cidade de interesse
  - key: Budget
    type: number
    description: Orçamento total informado (valor numérico puro)
  - key: Min Price
    type: number
    description: Valor mínimo da faixa de preço (valor numérico puro)
  - key: Max Price
    type: number
    description: Valor máximo da faixa de preço (valor numérico puro)
  - key: Bedrooms
    type: integer
    description: Quantidade de quartos desejada
  - key: Garage
    type: integer
    description: Quantidade de vagas de garagem desejada
  - key: Approved Financing
    type: boolean
    description: Se o cliente já possui financiamento aprovado
  - key: Purpose
    type: string
    description: Finalidade (ex. moradia, investimento)
  - key: Purchase Timeline
    type: string
    description: Prazo estimado para compra ou mudança
  - key: Viewing Interest
    type: boolean
    description: Se o cliente demonstrou interesse explícito em visitar
  - key: Mentioned Property
    type: string
    description: Imóvel ou código específico mencionado pelo cliente
  - key: Lead Score
    type: string
    description: Classificação qualitativa do lead quando explícita
  - key: Children
    type: string
    description: Informação sobre filhos mencionada pelo cliente
  - key: Pet
    type: boolean
    description: Se o cliente mencionou possuir animais de estimação

signals:
  - key: has_new_question
    description: true se a NOVA MENSAGEM contém uma pergunta clara
  - key: has_pending_question
    description: true se há pergunta nas MENSAGENS RECENTES ainda não respondida
  - key: has_pending_visit
    description: true se uma visita foi sugerida mas ainda não confirmada
  - key: has_pending_call
    description: true se uma ligação ou reunião foi sugerida mas ainda não confirmada
  - key: has_pending_documents
    description: true se documentos foram solicitados mas ainda não enviados
  - key: customer_engaged
    description: true se o cliente está respondendo ativamente, perguntando ou interagindo

intents:
  - name: ask_info
    description: Cliente pergunta sobre imóveis disponíveis, preços, bairro ou condições
    examples:
      - "Tem apartamento de 2 quartos no Centro?"
      - "Qual o valor do condomínio?"
    action: reply
  - name: schedule_visit
    description: Cliente quer agendar ou confirmar visita a um imóvel
    examples:
      - "Quero agendar uma visita amanhã às 14h"
      - "Podemos visitar no sábado?"
    action: create_task
  - name: send_documents
    description: Cliente pergunta sobre envio de documentos ou aprovação de crédito
    examples:
      - "Quais documentos preciso mandar para financiar?"
      - "Enviei meu holerite"
    action: create_task
  - name: negotiation_or_exception
    description: Proposta fora da tabela, permuta ou condição comercial especial
    examples:
      - "Aceita carro na troca e desconto de 15%?"
    action: escalate
  - name: request_human
    description: Cliente pede explicitamente para falar com um atendente/corretor humano
    examples:
      - "Quero falar com um corretor"
      - "Pode me passar um atendente?"
    action: handoff
  - name: opt_out
    description: Cliente pede para parar de receber mensagens ou sair do atendimento
    examples:
      - "Não quero mais receber mensagens"
      - "SAIR"
      - "Pode parar de mandar"
    action: opt_out
  - name: greeting_or_followup
    description: Saudação inicial ou resposta curta de acompanhamento
    examples:
      - "Oi, tudo bem?"
      - "Obrigado!"
    action: reply

opt_out_keywords:
  - parar
  - sair
  - stop
  - unsubscribe
  - "não quero mais"
  - "cancelar mensagens"

task_rules:
  - type: schedule_visit
    title: "Confirmar visita sugerida pelo cliente"
    trigger_signal: has_pending_visit
    trigger_intent: schedule_visit
    context_section: visit
    due_in_minutes: 60
  - type: schedule_call
    title: "Agendar ligação ou reunião solicitada"
    trigger_signal: has_pending_call
    context_section: call
    due_in_minutes: 60
  - type: collect_documents
    title: "Acompanhar envio de documentos do cliente"
    trigger_signal: has_pending_documents
    trigger_intent: send_documents
    context_section: documents
    due_in_minutes: 120

context:
  - key: last_action
    description: Ação principal identificada na última mensagem
    fields:
      - key: type
        type: enum
        values: [question, visit, documents, call, followup, other]
      - key: actor
        type: enum
        values: [broker, customer]
      - key: description
        type: string
        description: Descrição curta em PT-BR (se type=question, incluir a pergunta exata ou fiel)
  - key: visit
    description: Detalhes de visita sugerida (manter expressões originais sem converter data)
    fields:
      - key: proposed_date
        type: string
      - key: proposed_time
        type: string
  - key: call
    description: Detalhes de ligação/reunião sugerida
    fields:
      - key: proposed_date
        type: string
      - key: proposed_time
        type: string
      - key: type
        type: enum
        values: [phone, video, in-person]
  - key: documents
    description: Detalhes de documentos solicitados
    fields:
      - key: requested
        type: boolean
      - key: description
        type: string

prompts:
  analysis: prompts/analysis.tmpl
  reply: prompts/reply.tmpl
  nudge: prompts/nudge.tmpl

rules:
  - Nunca assumir fatos não declarados explicitamente pelo cliente.
  - Faça UMA pergunta de qualificação por vez para entender o perfil do cliente.
  - Nunca invente imóveis, preços, condições ou informações que não estejam no conhecimento ou na conversa.
  - Responda sempre em Português (PT-BR).
  - Quando não souber a resposta com base no conhecimento, responda de forma neutra sem chutar.

context_module:
  providers: [summary, facts, signals, recent_messages, knowledge]
  exposed_fields:
    facts: [Intent, Property Type, Location, Budget, Min Price, Max Price, Bedrooms, Garage, Approved Financing, Purpose, Purchase Timeline, Viewing Interest, Mentioned Property, Lead Score, Children, Pet]
    signals: [has_new_question, has_pending_question, has_pending_visit, has_pending_documents, has_pending_call, customer_engaged]
    context_sections: [last_action, visit, call, documents]
  views:
    external_agent:
      blocks: [summary, facts, signals, structured_context, recent_messages]
      format: delimited
      max_tokens: 2000
    summary_only:
      blocks: [summary]
      format: json
      max_tokens: 400
