name: supporter
language: pt-BR

timing:
  debounce_ms: 8000
  typing_max_wait_ms: 16000

actors:
  business: agent
  customer: user

facts:
  - key: UserRole
    type: enum
    values: [consultor, gestor]
    description: Papel do usuário na operação (consultor ou gestor)
  - key: Topic
    type: string
    description: Assunto, módulo ou processo mencionado (ex. comissões, metas, CRM, fechamento, relatórios)
  - key: Severity
    type: enum
    values: [low, medium, high, critical]
    description: Impacto ou gravidade da dúvida ou ocorrência na operação
  - key: ReferenceId
    type: string
    description: Código de referência, ID de venda, cliente ou erro exibido (ex. VENDA-123, ERR-403)
  - key: ChannelOrScreen
    type: string
    description: Tela, funcionalidade ou ambiente onde a dúvida ou problema ocorreu (ex. painel de metas, app, web)
  - key: TargetUser
    type: string
    description: Nome ou e-mail de um consultor, gestor ou do próprio interlocutor informado para consulta, auditoria ou verificação no sistema (ex. Emanuelly, Carlos, sheila.fernandes@autorizadoademicon.com.br)
  - key: HasAttachment
    type: boolean
    description: Se o usuário enviou captura de tela, documento ou evidência

signals:
  - key: has_new_question
    description: true se a NOVA MENSAGEM contém uma dúvida objetiva
  - key: has_pending_question
    description: true se há dúvida recente ainda não respondida
  - key: has_pending_issue
    description: true se foi relatada uma falha ou divergência pendente de verificação
  - key: has_pending_callback
    description: true se um retorno de especialista ou liderança foi solicitado mas não agendado
  - key: user_engaged
    description: true se o consultor ou gestor está interagindo ativamente
  - key: needs_api_lookup
    description: true se o usuário pediu para consultar, conferir, verificar ou auditar um registro/dado específico no sistema (ex. se um contrato específico existe ou pertence a alguém, dados de um consultor específico, matrícula, status de importação ou scraping); false se for dúvida genérica, saudação ou procedimento de manual (como fazer algo)
  - key: issue_resolved
    description: true se o usuário confirmou que o problema foi resolvido, deu certo ou agradeceu pelo atendimento concluído

dimensions:
  - key: sentiment
    values: [positive, neutral, negative, frustrated, unknown]
    default: unknown
    description: Sentimento percebido na última interação (use unknown se não houver evidência)
  - key: urgency
    values: [low, medium, high, critical, unknown]
    default: unknown
    description: Nível de urgência percebido (use unknown se não houver evidência)

intents:
  - name: ask_howto
    description: Dúvida sobre uso da plataforma, localização ou status/sincronização de contratos, matrículas, equipes, usuários, plano de carreira ou processos internos
    examples:
      - "Eu não encontro o contrato no sistema"
      - "Tem um contrato que está como cancelado e já está ativo, o cliente pagou mas o sistema ainda não reflete"
      - "Um consultor saiu da minha equipe, o que devo fazer?"
    action: reply
  - name: report_issue
    description: Relato de erro, divergência de valores, falha ou indisponibilidade no sistema
    examples:
      - "Os valores do meu fechamento não estão batendo no painel"
      - "Estou recebendo erro ao tentar lançar uma proposta"
    action: create_task
  - name: policy_exception
    description: Solicitação de exceção comercial, ajuste manual, desconto fora da alçada ou aprovação especial
    examples:
      - "Preciso de aprovação para um desconto acima do limite"
      - "Preciso de ajuste manual em uma comissão lançada incorretamente"
    action: escalate
  - name: request_human
    description: Consultor ou gestor pede para falar com um atendente humano, supervisor ou time responsável
    examples:
      - "Quero falar com alguém do suporte interno"
      - "Pode me transferir para um responsável?"
    action: handoff
  - name: opt_out
    description: Usuário pede para parar de receber mensagens ou notificações
    examples:
      - "Não quero mais receber notificações"
      - "SAIR"
    action: opt_out
  - name: greeting
    description: Saudação inicial de abertura ou cumprimento sem dúvida técnica (ex. "Olá", "Bom dia", "Boa tarde", "Oi")
    examples:
      - "Olá, bom dia!"
      - "Oi, tudo bem?"
      - "Boa noite!"
    action: reply
  - name: closing_or_gratitude
    description: Agradecimento pelo atendimento, confirmação de que deu certo/resolveu, ou encerramento cordial (ex. "Obrigado", "Valeu", "Deu certo", "Consegui", "Muito obrigado", "Resolvido", "Tudo certo agora")
    examples:
      - "Obrigado!"
      - "Valeu pela ajuda"
      - "Deu certo, consegui ver aqui"
      - "Muito obrigado, tudo resolvido!"
    action: reply

opt_out_keywords:
  - parar
  - sair
  - stop
  - unsubscribe
  - "cancelar mensagens"

task_rules:
  - type: investigate_issue
    title: "Investigar falha ou divergência relatada pelo consultor/gestor"
    trigger_signal: has_pending_issue
    trigger_intent: report_issue
    context_section: ticket
    due_in_minutes: 30
  - type: schedule_callback
    title: "Agendar retorno com especialista ou time responsável"
    trigger_signal: has_pending_callback
    context_section: callback
    due_in_minutes: 60

context:
  - key: last_action
    description: Ação principal identificada na última mensagem
    fields:
      - key: type
        type: enum
        values: [question, issue_report, exception_request, callback, other]
      - key: actor
        type: enum
        values: [agent, user]
      - key: description
        type: string
  - key: ticket
    description: Detalhes de falha ou divergência relatada
    fields:
      - key: module
        type: string
      - key: details
        type: string
  - key: callback
    description: Preferência de horário para retorno
    fields:
      - key: preferred_window
        type: string

prompts:
  analysis: prompts/analysis.tmpl
  reply: prompts/reply.tmpl
  nudge: prompts/nudge.tmpl

rules:
  - 'Nunca invente regras comerciais, percentuais de comissão, metas, prazos ou procedimentos fora da base de conhecimento.'
  - 'Cada mensagem possui o marcador [answered=true] ou [answered=false]. Responda EXCLUSIVAMENTE às perguntas e solicitações com [answered=false] (NOVA MENSAGEM DO USUÁRIO). Nunca volte a responder ou repetir explicações de contratos, status ou dúvidas que já foram respondidas em mensagens marcadas com [answered=true].'
  - 'Quando o documento "api-live-data.md" (Dados Reais Consultados na API do Sistema) estiver presente na BASE DE CONHECIMENTO, utilize os dados reais retornados pela API como fonte oficial para responder diretamente se o contrato existe, para qual consultor está atribuído (userName), equipe (teamName), matrícula (matriculaNumber), status (status / isActive) ou demais dados consultados, incluindo "api-live-data.md" no array "sources".'
  - 'Quando o usuário perguntar quem é o gestor da equipe, líder ou responsável pelo consultor, e houver dados de usuário em "api-live-data.md", utilize "parentUserName" (nome do gestor) e "parentEmail" (e-mail do gestor) retornados na API como a identificação oficial do gestor responsável pela equipe.'
  - 'Sempre peça o contexto necessário (módulo, tela ou ID de referência) caso falte para esclarecer a dúvida ou investigar uma divergência.'
  - 'Quando o usuário perguntar se você consegue saber ou quem é o gestor dele ("você consegue saber quem é?", "quem é meu gestor?") sem ter se identificado, confirme que consegue verificar e solicite o nome completo, e-mail de acesso ou o número de um contrato para localizar o cadastro dele no sistema.'
  - 'Quando você estiver orientando procedimentos ou solicitando dados ao usuário (como nome, e-mail, matrícula, tela ou contrato) para poder pesquisar ou ajudá-lo, defina SEMPRE "answerable": true. Nunca marque "answerable": false ao pedir dados ao usuário.'
  - 'Quando o usuário apenas agradecer (ex.: "obrigado", "valeu", "muito obrigado", "agradeço") ou confirmar que deu certo / que resolveu (ex.: "deu certo", "consegui", "resolvido", "perfeito", "funcionou"), mesmo que a mensagem venha horas ou no dia seguinte após a dúvida ter sido respondida: classifique o intent como "closing_or_gratitude", com "has_new_question": false e "issue_resolved": true. NUNCA classifique agradecimento ou confirmação de resolução como "greeting".'
  - 'Se a mensagem contiver agradecimento mas também contiver uma nova dúvida objetiva (ex.: "Obrigado! E como vejo o contrato 123?"), classifique o intent como "ask_howto" (ou "report_issue") e marque "has_new_question": true para que a nova dúvida seja prontamente atendida.'
  - 'Quando o usuário disser que um consultor "saiu da equipe" (ou "não faz mais parte da equipe" / "quero tirar da equipe") sem especificar o motivo, pergunte primeiro se o consultor saiu da Ademicon (não trabalha mais na empresa) ou se migrou para outra equipe. Se saiu da Ademicon (desligamento da empresa), oriente SOMENTE a desativar o usuário em Usuários → Lista (#/users), sem mexer no Calendário de Equipes. Se saiu da equipe e migrou para outra equipe (ou virou gestor de nova equipe), oriente a ajustar a data de corte em Equipes → Calendário (#/teams/calendar).'
  - 'Quando o usuário informar que não encontra um contrato no sistema (ou que um contrato não aparece), oriente primeiro sobre as duas causas principais: (1) algum filtro mal formatado ou ativo (como Data Início e Data Fim), recomendando clicar em "Limpar Filtros"; e (2) o contrato ainda não estar no sistema, informando que todos os dias sincronizamos o banco de dados com os contratos do Avapro (Ava Pro) e que pode demorar até 24h para aparecer um novo contrato.'
  - 'Quando o usuário informar que um contrato aparece como cancelado (ou desatualizado) mesmo após o cliente ter pago / já estar ativo, explique as duas possibilidades: (1) no Avapro (Ava Pro) o contrato ainda aparece como cancelado — nesse caso, deve entrar em contato com a Ademicon para verificar junto ao Avapro; ou (2) o estado mudou no Avapro há menos de 24h e ainda não refletiu no sistema — nesse caso, basta aguardar a sincronização diária que acontece toda manhã.'
  - 'Quando o usuário pedir um treinamento, resumo ou visão geral de como funciona o sistema e o que o gestor deve fazer, explique que: (1) o gestor basicamente adiciona e remove consultores e dá suporte a eles; (2) o gestor consegue ver todos os contratos abaixo dele, as equipes abaixo dele e acompanhar o Plano de Carreira; (3) usar os filtros em "Contratos" (#/contracts) para filtrar a equipe é muito importante; e (4) os consultores abaixo dele devem atribuir seus próprios contratos vendidos em "Meus Contratos" (#/my-contracts) > "+ Novo" (é papel do consultor fazer isso, mesmo que o gestor também possa fazer em "Contratos" editando o contrato e adicionando ou modificando o vendedor).'
  - 'Responda sempre em Português (PT-BR), com clareza, objetividade e tom adequado a consultores e gestores.'
  - 'Quando não tiver certeza na base de conhecimento, informe que vai encaminhar ao time responsável sem chutar.'

context_module:
  providers: [summary, facts, signals, recent_messages, knowledge]
  exposed_fields:
    facts: [UserRole, Topic, Severity, ReferenceId, TargetUser, ChannelOrScreen, HasAttachment]
    signals: [has_new_question, has_pending_question, has_pending_issue, has_pending_callback, user_engaged, needs_api_lookup, issue_resolved]
    context_sections: [last_action, ticket, callback]
  views:
    external_agent:
      blocks: [summary, facts, signals, structured_context, recent_messages]
      format: delimited
      max_tokens: 2000
    summary_only:
      blocks: [summary]
      format: json
      max_tokens: 400

fsm:
  initial_state: triage
  states: [triage, assisting, resolved, escalated, opted_out]
  transitions:
    - from: "*"
      to: opted_out
      when:
        intent: opt_out
      action: opt_out_action
    - from: "*"
      to: escalated
      when:
        intent: request_human
      action: handoff_action
    - from: "*"
      to: escalated
      when:
        intent: policy_exception
      action: escalate_action
    - from: triage
      to: assisting
      when:
        intent: ask_howto
      action: reply_with_knowledge
    - from: triage
      to: assisting
      when:
        intent: greeting
      action: greet_support
    - from: triage
      to: resolved
      when:
        intent: closing_or_gratitude
      action: close_support
    - from: triage
      to: assisting
      when:
        intent: report_issue
        required_facts: [ChannelOrScreen]
      action: reply_with_knowledge
    - from: triage
      to: assisting
      when:
        intent: report_issue
      action: reply_with_knowledge
    - from: assisting
      to: resolved
      when:
        intent: closing_or_gratitude
      action: close_support
    - from: assisting
      to: assisting
      when:
        intent: greeting
      action: greet_support
    - from: assisting
      to: assisting
      when:
        intent: report_issue
        required_facts: [ChannelOrScreen]
      action: reply_with_knowledge
    - from: assisting
      to: assisting
      when:
        intent: report_issue
      action: reply_with_knowledge
    - from: assisting
      to: assisting
      when:
        intent: ask_howto
      action: reply_with_knowledge
    - from: resolved
      to: resolved
      when:
        intent: closing_or_gratitude
      action: close_support
    - from: resolved
      to: assisting
      when:
        intent: greeting
      action: greet_support
    - from: resolved
      to: assisting
      when:
        intent: ask_howto
      action: reply_with_knowledge
    - from: resolved
      to: assisting
      when:
        intent: report_issue
        required_facts: [ChannelOrScreen]
      action: reply_with_knowledge
    - from: resolved
      to: assisting
      when:
        intent: report_issue
      action: reply_with_knowledge
  actions:
    greet_support:
      type: message_template
      text: "Olá! Sou o assistente de suporte para consultores e gestores. Como posso te ajudar hoje?"
    close_support:
      type: message_template
      text: "Por nada! Fico à disposição se precisar de algo mais. Tenha um ótimo dia e bom trabalho!"
    reply_with_knowledge:
      type: knowledge_reply
    ask_issue_details:
      type: message_template
      text: "Para verificarmos o ocorrido, poderia me informar em qual tela ou módulo o problema aconteceu e, se houver, o código ou ID de referência?"
    acknowledge_issue:
      type: message_template
      text: "Obrigado pelas informações! Registramos sua solicitação e o time responsável já está analisando o caso."
    handoff_action:
      type: handoff
    escalate_action:
      type: escalate
    opt_out_action:
      type: opt_out
