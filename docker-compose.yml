services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: whatshelper-dynamodb
    restart: unless-stopped
    user: root
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ > /dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio:
    image: cleanstart/minio@sha256:c79d95411873282e192209a7af1a7d7524aeae2371bf53737b1e6ae6baa0c06d
    container_name: whatshelper-minio
    restart: unless-stopped
    user: root
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio-init:
    image: drpsychick/minio-client@sha256:8fb24fd225727f183710eaed1fd6ed378ee87a152a47002e65c22f9383a3d807
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'Aguardando MinIO iniciar...'
          sleep 1
        done
        /usr/bin/mc mb --ignore-existing local/whatshelper-blobs
        /usr/bin/mc version enable local/whatshelper-blobs
        for prefix in demo/traces/ demo-support/traces/; do
          if ! /usr/bin/mc ilm rule ls local/whatshelper-blobs 2>/dev/null | grep -q "$$prefix"; then
            /usr/bin/mc ilm rule add --prefix "$$prefix" --expire-days 90 local/whatshelper-blobs || true
          fi
        done
        echo 'Bucket whatshelper-blobs criado com versionamento ativo e ILM 90d para traces'
        exit 0

  store-init:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      dynamodb-local:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      DYNAMODB_TABLE: "whatshelper-brain"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "whatshelper-blobs"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_REGION: "us-east-1"
    entrypoint: ["/app/brain", "store", "init"]

  brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatshelper-brain
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      store-init:
        condition: service_completed_successfully
    environment:
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8080"
      API_TOKEN: "${API_TOKEN:-}"
      CONNECTOR_TOKEN: "${CONNECTOR_TOKEN:-}"
      PII_ENCRYPTION_KEY: "${PII_ENCRYPTION_KEY:-}"
      ALLOW_INSECURE_BIND: "true" # Porta no host está restrita a 127.0.0.1:8080
      APP_ENV: "development"
      LOG_LEVEL: "info"
      LOG_FORMAT: "text"
      DYNAMODB_ENDPOINT: "http://dynamodb-local:8000"
      DYNAMODB_TABLE: "whatshelper-brain"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "whatshelper-blobs"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_REGION: "us-east-1"
      S3_USE_SSL: "false"
      LLM_PROVIDER: "${LLM_PROVIDER:-fake}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      MODEL_ANALYSIS: "${MODEL_ANALYSIS:-}"
      MODEL_RESPONSE: "${MODEL_RESPONSE:-}"
      MODEL_NUDGE: "${MODEL_NUDGE:-}"
      MODEL_LEARNING: "${MODEL_LEARNING:-}"
      TRANSCRIPTION_URL: "${TRANSCRIPTION_URL:-}"
      TRANSCRIPTION_API_KEY: "${TRANSCRIPTION_API_KEY:-}"
      TRANSCRIPTION_MODEL: "${TRANSCRIPTION_MODEL:-}"
      DEBOUNCE_MS: "${DEBOUNCE_MS:-1500}"
      PACKS_DIR: "/app/packs"
      TENANTS_DIR: "/app/tenants"
    volumes:
      - ./packs:/app/packs:ro
      - ./tenants:/app/tenants:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  connector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatshelper-connector
    restart: unless-stopped
    entrypoint: ["/app/connectors"]
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      brain:
        condition: service_healthy
    environment:
      BRAIN_URL: "http://brain:8080"
      API_TOKEN: "${API_TOKEN:-}"
      CONNECTOR_TOKEN: "${CONNECTOR_TOKEN:-}"
      CONNECTOR_HTTP_ADDR: "0.0.0.0:8081"
      WHATSAPP_ENABLED: "${WHATSAPP_ENABLED:-true}"
      WHATSAPP_DB_PATH: "/data/whatsapp.db"
      WHATSAPP_TENANT_ID: "${WHATSAPP_TENANT_ID:-demo}"
      WHATSAPP_ACCOUNT: "${WHATSAPP_ACCOUNT:-main}"
      ADMIN_PHONE_E164: "${ADMIN_PHONE_E164:-}"
      WHATSAPP_ALLOW_GROUPS: "${WHATSAPP_ALLOW_GROUPS:-false}"
      WHATSAPP_PAIR_PHONE: "${WHATSAPP_PAIR_PHONE:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-text}"
    volumes:
      - whatsapp_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dynamodb_data:
  minio_data:
  whatsapp_data:
